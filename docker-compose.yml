version: "3.9"

services:
  api:
    build: .
    container_name: cardcheck-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      # Mount the whole data dir (not individual files) so cards.db AND its transient WAL
      # -wal/-shm sidecars live on ONE shared mount visible to both the api and
      # price-updater containers. Sharing the sidecars is what WAL needs to avoid the
      # cross-container "database disk image is malformed" corruption.
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 6G

  price-updater:
    build: .
    container_name: cardcheck-price-updater
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      # Same shared data dir as the api (WAL sidecars must be shared — see api service).
      - ./data:/app/data
    entrypoint: ["bash", "-c"]
    command:
      - |
        apt-get update && apt-get install -y --no-install-recommends cron && rm -rf /var/lib/apt/lists/*
        printenv | grep -E '^(POKETRACE_|POKEMON_API_|GEMINI_)' >> /etc/environment
        printf '0 4 * * * cd /app && /usr/local/bin/python /app/data/thecardapi_sold.py run --budget 40000 --sales-db /app/data/sales.db --cards-db /app/data/cards.db >> /proc/1/fd/1 2>&1\n0 5 * * * cd /app && /usr/local/bin/python /app/data/refresh_cardmarket_priceguide.py --db /app/data/cards.db >> /proc/1/fd/1 2>&1\n0 6 * * * cd /app && /usr/local/bin/python scripts/update_prices_daily.py >> /proc/1/fd/1 2>&1\n' | crontab -
        echo "Cron scheduled: The Card API sold-comps 04:00 + CardMarket refresh 05:00 + PokeTrace update 06:00 UTC"
        cron -f
    deploy:
      resources:
        limits:
          memory: 2G
